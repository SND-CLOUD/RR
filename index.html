<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" id="app-theme-color" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>نظام سندات الصيانة - SND</title>
    <meta name="description" content="نظام متكامل لإدارة مراكز صيانة الأجهزة والشبكات والراوترات. تتبع الأجهزة، فواتير صيانة، تقارير أداء، وإدارة عملاء." />
    <meta property="og:title" content="نظام سندات الصيانة - SND" />
    <meta property="og:description" content="نظام متكامل لإدارة مراكز صيانة الأجهزة والشبكات والراوترات. تتبع الأجهزة، فواتير صيانة، تقارير أداء، وإدارة عملاء." />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('snd_settings');
          var settings = raw ? JSON.parse(raw) : {};
          var appearance = settings.appearance !== undefined ? settings.appearance : 'auto';
          var isLight = false;
          if (appearance === 'normal') {
            isLight = true;
          } else if (appearance === 'dark') {
            isLight = false;
          } else {
            isLight = !(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          }
          var root = document.documentElement;
          if (isLight) {
            root.classList.add('light-app');
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          } else {
            root.classList.remove('light-app');
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
          var meta = document.getElementById('app-theme-color');
          if (meta) meta.setAttribute('content', isLight ? '#f8fafc' : '#0a0a0a');
        } catch (e) {}
      })();
    </script>
    <script>
      // Safe WebAssembly streaming compilation polyfill for iframe and sandbox environments
      if (typeof window !== 'undefined' && typeof WebAssembly !== 'undefined') {
        const origStreaming = WebAssembly.instantiateStreaming;
        WebAssembly.instantiateStreaming = async function (source, importObject) {
          try {
            const res = await Promise.resolve(source);
            const bytes = await (res.clone ? res.clone() : res).arrayBuffer();
            return await WebAssembly.instantiate(bytes, importObject);
          } catch (e) {
            if (typeof origStreaming === 'function') {
              return origStreaming.call(WebAssembly, source, importObject);
            }
            throw e;
          }
        };

        // Suppress benign fallback warnings from Emscripten/sql.js in iframe
        const filterWasmMsg = (args) => {
          if (!args || !args[0]) return false;
          const str = String(args[0]);
          return str.includes('wasm streaming compile failed') || str.includes('falling back to ArrayBuffer instantiation');
        };

        const origWarn = console.warn;
        console.warn = function (...args) {
          if (filterWasmMsg(args)) return;
          origWarn.apply(console, args);
        };

        const origError = console.error;
        console.error = function (...args) {
          if (filterWasmMsg(args)) return;
          origError.apply(console, args);
        };
      }
    </script>
  </head>
  <body>
    <jeep-sqlite data-html2canvas-ignore="true" style="display:none" wasmPath="/assets" wasm-path="/assets"></jeep-sqlite>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
